spring.application.name=project_module4_dvc

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:egov_db}?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:your-mysql-password}}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

server.port=${SERVER_PORT:${APP_PORT:8080}}
spring.main.lazy-initialization=true
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.jmx.enabled=false

# Gi?m thread pool
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5

# T?t devtools trong production
spring.devtools.enabled=false

# C?u h�nh k�ch th??c file upload (V� d?: Max 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Th? m?c l?u tr? file upload
app.upload.dir=./uploads/citizen_documents/

# VNPAY config
vnpay.tmn-code=${VNPAY_TMN_CODE:your-tmn-code}
vnpay.hash-secret=${VNPAY_HASH_SECRET:your-secret}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}

# Callback URLs (ngrok/production)
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:${SERVER_PORT:${APP_PORT:8080}}/payment/vnpay-return}
vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:${SERVER_PORT:${APP_PORT:8080}}/vnpay/ipn}
